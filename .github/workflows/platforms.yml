name: platforms

# Runs the suite and the desktop package build on macOS and Windows, which the Linux CI job cannot cover:
# the sandbox-exec sandbox, the macOS keychain backend, the PowerShell worktree runner, and the packaged apps.
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Tests
        run: bun test
      - name: Build the desktop package for this platform (unsigned)
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then bun run package:mac; else RIGWELL_BUN_BIN="$(command -v bun).exe" bun run package:win || RIGWELL_BUN_BIN="$(command -v bun)" bun run package:win; fi
      - name: List built artifacts
        shell: bash
        run: ls -la desktop/release || true
