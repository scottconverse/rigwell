name: platforms

# Runs the suite and the desktop package build on macOS and Windows, which the Linux CI job cannot cover:
# the sandbox-exec sandbox, the macOS keychain backend, the PowerShell worktree runner, and the packaged apps.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      signed_baseline_run:
        description: Retained sign-only run containing the 0.1.0 baseline installer
        required: true
        type: string
      signed_candidate_run:
        description: Existing sign-only run containing the candidate installer
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      # evidence/ holds reference captures with paths too long for Windows; Rigwell never reads it, so leave it out.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/evidence/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # npm ci does not always fetch the Electron binary; run its installer when the app bundle is missing.
      - name: Install the Electron binary
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then test -d node_modules/electron/dist/Electron.app/Contents/MacOS || node node_modules/electron/install.js; \
          else test -f node_modules/electron/dist/electron.exe || node node_modules/electron/install.js; fi
          ls node_modules/electron/dist | head
      - name: Typecheck
        run: bunx tsc --noEmit -p .
      - name: Install Chromium for browser acceptance
        working-directory: desktop
        run: npx playwright install chromium
      - name: Tests
        run: bun test
      - name: Build the desktop package for this platform (unsigned)
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then bun run package:mac; else RIGWELL_BUN_BIN="$(command -v bun).exe" bun run package:win || RIGWELL_BUN_BIN="$(command -v bun)" bun run package:win; fi
      - name: List built artifacts
        shell: bash
        run: ls -la desktop/release || true
      - name: Install NSIS package on the clean Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem desktop/release -Filter '*.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'rigwell-installed'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S',"/D=$destination" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          bun desktop/packaging/accept-install.ts (Join-Path $destination 'rigwell.exe') desktop/release/installed-acceptance.json --require-eval-tasks
          if ($LASTEXITCODE -ne 0) { throw 'Installed first run failed' }
      - name: Install DMG package on the clean macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/rigwell-dmg"
          destination="$RUNNER_TEMP/rigwell-installed"
          mkdir -p "$mount" "$destination"
          hdiutil attach desktop/release/*.dmg -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          cp -R "$mount/Rigwell.app" "$destination/Rigwell.app"
          hdiutil detach "$mount"
          trap - EXIT
          bun desktop/packaging/accept-install.ts "$destination/Rigwell.app/Contents/MacOS/rigwell" desktop/release/installed-acceptance.json --require-eval-tasks
      - name: Preserve packages and installed acceptance
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ github.sha }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/installed-acceptance.json
          if-no-files-found: error
          retention-days: 7

  signed-install:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/phase-1-core-loop'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/evidence/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - uses: actions/download-artifact@v4
        with:
          repository: scottconverse/civiccast
          name: signed-native-installer
          run-id: ${{ inputs.signed_baseline_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-baseline
      - uses: actions/download-artifact@v4
        with:
          repository: scottconverse/civiccast
          name: signed-native-installer
          run-id: ${{ inputs.signed_candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-candidate
      - name: Verify signed install, upgrade and local rollback
        shell: pwsh
        run: bun desktop/packaging/accept-windows-update.ts "$env:RUNNER_TEMP/signed-baseline" "$env:RUNNER_TEMP/signed-candidate" signed-update-acceptance.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-acceptance-${{ github.sha }}
          path: signed-update-acceptance.json
          if-no-files-found: error
          retention-days: 7
