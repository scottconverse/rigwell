name: website
on:
  push:
    branches: [phase-1-core-loop]
    paths: ['website/**', 'docs/**', 'package.json', 'bun.lock', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/**', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: bun run site:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
