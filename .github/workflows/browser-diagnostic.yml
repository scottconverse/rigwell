name: browser-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-browser:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/evidence/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - run: npx playwright install chromium
        working-directory: desktop
      - name: Reproduce owned browser navigation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path browser-diagnostic-logs | Out-Null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            bun test test/desktop/agent-browser.test.ts 2>&1 | Tee-Object "browser-diagnostic-logs/attempt-$attempt.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-diagnostic-logs
          path: browser-diagnostic-logs
