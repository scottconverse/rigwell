name: release

# Builds the desktop installers for a version tag (v*) and attaches them to that tag's GitHub release.
# Windows is the only platform a release needs (decision 341). macOS and Linux build in their own jobs at the
# same time. They do not hold up Windows, and if one of them fails the Windows files still ship.
# Tag only a commit whose ci and platforms runs are green; this workflow builds and uploads, it does not test.
#
# Windows signing: rigwell.exe, the uninstaller and the setup file are signed with Azure Artifact Signing
# by desktop/packaging/sign.cjs. The job stops if any of them is not validly signed by Scott Converse.
# A hand run (workflow_dispatch) builds and checks the signed Windows files only. It makes no release.
# It keeps the setup file as a run artifact for 1 day.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # Makes a draft release for the tag if there is none yet. The Windows job publishes it.
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create the draft release
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Rigwell $TAG" --notes "Installers for $TAG."

  windows:
    needs: draft
    # On a hand run the draft job is skipped; Windows still runs.
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/evidence/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install the Electron binary
        working-directory: desktop
        shell: bash
        run: test -f node_modules/electron/dist/electron.exe || node node_modules/electron/install.js
      - name: Install the Azure signing module
        shell: pwsh
        run: Install-Module -Name ArtifactSigning -RequiredVersion 0.1.20 -Force -Repository PSGallery -Scope CurrentUser
      - name: Build and sign the installer
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          RIGWELL_SIGN: "1"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: RIGWELL_BUN_BIN="$(command -v bun).exe" bun run package:win --publish never || RIGWELL_BUN_BIN="$(command -v bun)" bun run package:win --publish never
      - name: Check every Windows signature (installs the app, then removes it)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'desktop/release'
          $setups = @(Get-ChildItem $rel -Filter 'rigwell-setup-*-x64.exe')
          if ($setups.Count -ne 1) { throw "expected 1 setup file, found $($setups.Count)" }
          $setup = $setups[0].FullName
          function Test-Ours($f) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if ($s.Status -ne 'Valid') { throw "$f : signature status is $($s.Status)" }
            if (-not $s.SignerCertificate.Subject.StartsWith('CN=Scott Converse')) { throw "$f : signer is $($s.SignerCertificate.Subject)" }
            if (-not $s.TimeStamperCertificate) { throw "$f : no timestamp" }
            Write-Host "OK  $f  ($($s.SignerCertificate.Subject))"
          }
          function Test-Bun($f) {
            $s = Get-AuthenticodeSignature -LiteralPath $f
            if ($s.Status -ne 'Valid') { throw "$f : Bun signature status is $($s.Status)" }
            Write-Host "OK  $f  (Bun, own signature: $($s.SignerCertificate.Subject))"
          }
          Test-Ours $setup
          Test-Ours "$rel/win-unpacked/rigwell.exe"
          Test-Bun "$rel/win-unpacked/resources/bun/bun.exe"
          # No other .exe may ship.
          $other = @(Get-ChildItem "$rel/win-unpacked" -Recurse -Filter *.exe | Where-Object { $_.Name -notin @('rigwell.exe', 'bun.exe') })
          if ($other.Count) { throw "unexpected exe files: $($other.FullName -join ', ')" }
          # latest.yml must describe the signed setup file.
          $sha512 = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($setup)))
          if (-not (Select-String -LiteralPath "$rel/latest.yml" -SimpleMatch "sha512: $sha512" -Quiet)) { throw "latest.yml sha512 does not match the signed setup file" }
          Write-Host "OK  latest.yml sha512 matches the signed setup file"
          # Install silently, check the installed files, then uninstall.
          $dir = Join-Path $env:RUNNER_TEMP 'rigwell-install'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "setup exit code $($p.ExitCode)" }
          Test-Ours "$dir/rigwell.exe"
          Test-Ours "$dir/Uninstall Rigwell.exe"
          Test-Bun "$dir/resources/bun/bun.exe"
          Start-Process -FilePath "$dir/Uninstall Rigwell.exe" -ArgumentList '/S' -Wait
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLower()
          "Signed setup file: $(Split-Path $setup -Leaf)  SHA-256: $sha256" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Keep the signed setup file (hand run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: rigwell-setup-signed
          path: desktop/release/rigwell-setup-*-x64.exe
          retention-days: 1
          if-no-files-found: error
      - name: Upload to the release and publish it
        if: github.event_name == 'push'
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/release/*.exe desktop/release/*.blockmap desktop/release/latest.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
          gh release edit "$TAG" --draft=false --latest

  macos:
    needs: draft
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install the Electron binary
        working-directory: desktop
        run: test -d node_modules/electron/dist/Electron.app/Contents/MacOS || node node_modules/electron/install.js
      - name: Build the app (unsigned, not notarized)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run package:mac --publish never
      - name: Upload to the release
        run: |
          shopt -s nullglob
          files=(desktop/release/*.dmg desktop/release/*.zip desktop/release/*.blockmap desktop/release/latest-mac.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  linux:
    needs: draft
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Install the Electron binary
        working-directory: desktop
        run: test -x node_modules/electron/dist/electron || node node_modules/electron/install.js
      - name: Build the AppImage and deb
        working-directory: desktop
        run: bun run package:linux --publish never
      - name: Upload to the release
        run: |
          shopt -s nullglob
          files=(desktop/release/*.AppImage desktop/release/*.deb desktop/release/latest-linux.yml)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber
